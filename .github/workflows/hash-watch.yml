name: hash-watch

# Google Cloud's own real published identity is a GROUP of 524 members --
# one resource-mode and one data-source-mode member per real, distinct
# Discovery Document (one merged document per product/version, unlike
# Azure's own per-domain-file split) -- ubx-provider-dynamic's own
# --generate-snapshot-group regenerates every real member from its own
# ONE config entry's single fetch (config.Provider.DataSources' own doc
# comment, ubx-provider-dynamic: UBI-182's own resource/data-source
# collapse) and assembles them into one real, versioned group container
# (internal/snapshot's own AssembleGroup: the highest real change level
# across every member, never hand-picked). --prev-snapshot points at
# THIS checkout's own root (already the real manifest.json + members/
# shape a real group needs), so a content change that doesn't affect
# any member's own translated schema produces NoChange and no PR.
#
# Never auto-merges, matching every other repo in this org.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-schema-google
        uses: actions/checkout@v4

      - name: Check out ubx-provider-dynamic's own latest real published release (to build it from source)
        id: dynver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # UBI-194: this must be a real, tagged release, never main HEAD --
          # a snapshot's own min_binary_version is stamped from this same
          # build (see the "Build ubx-provider-dynamic" step's -ldflags
          # below), so building an untagged HEAD would stamp every
          # regenerated snapshot with the meaningless default "dev" instead
          # of a real, acquirable version. Using the latest real GitHub
          # Release (not main HEAD) means MinBinaryVersion always names a
          # binary a real ubx install can actually acquire via
          # provider.AcquireDynamicProviderBinary.
          ver="$(gh api repos/Ubiquex/ubx-provider-dynamic/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building against ubx-provider-dynamic's real, latest published release: v$ver"
          git clone --depth=1 --branch "v$ver" \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubx-provider-dynamic-src/go.mod

      - name: Build ubx-provider-dynamic
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubx-provider-dynamic-src" \
            -ldflags "-X github.com/ubiquex/ubx-provider-dynamic/internal/snapshot.BinaryVersion=${{ steps.dynver.outputs.version }}" \
            -o "${{ runner.temp }}/ubx-provider-dynamic" \
            ./cmd/ubx-provider-dynamic
          got="$("${{ runner.temp }}/ubx-provider-dynamic" --version)"
          if [ "$got" != "${{ steps.dynver.outputs.version }}" ]; then
            echo "built binary reports version '$got', expected '${{ steps.dynver.outputs.version }}'" >&2
            exit 1
          fi

      - name: Read the committed group version before regenerating
        id: before
        run: |
          set -euo pipefail
          current="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Committed manifest.json is at version $current"

      - name: Regenerate all real members and assemble the group
        id: gen
        run: |
          set -euo pipefail
          # UBI-229: every real member's own generation input
          # (schema_source, schema_url, base_url, auth, retry, timeouts,
          # resources, wire_name, version_qualifier, target_prefix,
          # data_source_namespace, namespace_from_tags) now comes
          # directly from THIS checkout's own already-committed
          # manifest.json/members/*.json (--group-members omitted,
          # --prev-snapshot alone drives generation -- ubx-provider-
          # dynamic PR 53) instead of a separate, independently
          # maintained config -- nothing here can drift from what is
          # actually published, which is what let azure_newrelic's own
          # moved path go uncaught in the first place. This step's own
          # prior embedded config also can never again grow large
          # enough on its own to break GitHub Actions' own workflow
          # parser -- the exact real failure this replaces: this file's
          # own embedded config previously measured 75678 characters
          # against the platform's real 21000-character expression-
          # length limit, and could not even be dispatched.
          rm -rf "${{ runner.temp }}/new-group"
          "${{ runner.temp }}/ubx-provider-dynamic" \
            --generate-snapshot-group="${{ runner.temp }}/new-group" \
            --group-repo-name=google \
            --prev-snapshot="$GITHUB_WORKSPACE"

          new="$(python3 -c "import json; print(json.load(open('${{ runner.temp }}/new-group/manifest.json'))['version'])")"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = "${{ steps.before.outputs.current }}" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already current at ${{ steps.before.outputs.current }} -- nothing to do."
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
            echo "Real version change: ${{ steps.before.outputs.current }} -> $new"
          fi

      - name: Report which real members changed
        if: steps.gen.outputs.newer == 'true'
        run: |
          set -euo pipefail
          for f in "${{ runner.temp }}"/new-group/members/*.json; do
            name="$(basename "$f" .json)"
            if ! diff -q "$f" "members/$name.json" > /dev/null 2>&1; then
              echo "changed member: $name"
            fi
          done

      - name: Open PR
        if: steps.gen.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp "${{ runner.temp }}/new-group/manifest.json" manifest.json
          cp "${{ runner.temp }}"/new-group/members/*.json members/
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="snapshot-regen/google-${{ steps.gen.outputs.new }}"
          git checkout -b "$branch"
          git add manifest.json members/
          git commit -m "snapshot: regenerate from Google Cloud's own live Discovery Documents, ${{ steps.before.outputs.current }} -> ${{ steps.gen.outputs.new }}"
          git push origin "$branch" --force
          gh pr create \
            --title "snapshot: regenerate from Google Cloud's own live Discovery Documents (${{ steps.before.outputs.current }} -> ${{ steps.gen.outputs.new }})" \
            --body "Automated regeneration (\`.github/workflows/hash-watch.yml\`), triggered by re-running ubx-provider-dynamic's own \`--generate-snapshot-group\` against Google Cloud's own live Discovery Documents (every real member, resource and data-source mode together) and diffing mechanically against the previously committed group.

          Previous version: \`${{ steps.before.outputs.current }}\`
          New version: \`${{ steps.gen.outputs.new }}\`

          Only the real, changed members/*.json files are touched -- unaffected members stay byte-identical. Never auto-merges -- review the diff before merging. After merge, dispatch \`publish.yml\` to cut the real GitHub Release." \
            --base main --head "$branch"
