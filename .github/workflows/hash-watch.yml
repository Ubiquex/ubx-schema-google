name: hash-watch

# Google Cloud's own real published identity is a GROUP of 524 members --
# one resource-mode and one data-source-mode member per real, distinct
# Discovery Document (one merged document per product/version, unlike
# Azure's own per-domain-file split) -- ubx-provider-dynamic's own
# --generate-snapshot-group regenerates every real member from its own
# ONE config entry's single fetch (config.Provider.DataSources' own doc
# comment, ubx-provider-dynamic: UBI-182's own resource/data-source
# collapse) and assembles them into one real, versioned group container
# (internal/snapshot's own AssembleGroup: the highest real change level
# across every member, never hand-picked). --prev-snapshot points at
# THIS checkout's own root (already the real manifest.json + members/
# shape a real group needs), so a content change that doesn't affect
# any member's own translated schema produces NoChange and no PR.
#
# Never auto-merges, matching every other repo in this org.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-schema-google
        uses: actions/checkout@v4

      - name: Check out ubx-provider-dynamic's own latest real published release (to build it from source)
        id: dynver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # UBI-194: this must be a real, tagged release, never main HEAD --
          # a snapshot's own min_binary_version is stamped from this same
          # build (see the "Build ubx-provider-dynamic" step's -ldflags
          # below), so building an untagged HEAD would stamp every
          # regenerated snapshot with the meaningless default "dev" instead
          # of a real, acquirable version. Using the latest real GitHub
          # Release (not main HEAD) means MinBinaryVersion always names a
          # binary a real ubx install can actually acquire via
          # provider.AcquireDynamicProviderBinary.
          ver="$(gh api repos/Ubiquex/ubx-provider-dynamic/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Building against ubx-provider-dynamic's real, latest published release: v$ver"
          git clone --depth=1 --branch "v$ver" \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubx-provider-dynamic-src/go.mod

      - name: Build ubx-provider-dynamic
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubx-provider-dynamic-src" \
            -ldflags "-X github.com/ubiquex/ubx-provider-dynamic/internal/snapshot.BinaryVersion=${{ steps.dynver.outputs.version }}" \
            -o "${{ runner.temp }}/ubx-provider-dynamic" \
            ./cmd/ubx-provider-dynamic
          got="$("${{ runner.temp }}/ubx-provider-dynamic" --version)"
          if [ "$got" != "${{ steps.dynver.outputs.version }}" ]; then
            echo "built binary reports version '$got', expected '${{ steps.dynver.outputs.version }}'" >&2
            exit 1
          fi

      - name: Read the committed group version before regenerating
        id: before
        run: |
          set -euo pipefail
          current="$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Committed manifest.json is at version $current"

      - name: Regenerate all real members and assemble the group
        id: gen
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/gen/.ubx"
          cat > "${{ runner.temp }}/gen/.ubx/config" <<'EOF'
          [dynamic_providers.google_agentidentity_v1alpha]
