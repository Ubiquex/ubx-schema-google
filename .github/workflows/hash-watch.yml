            --body "Automated regeneration (\`.github/workflows/hash-watch.yml\`), triggered by re-running ubx-provider-dynamic's own \`--generate-snapshot-group\` against Google Cloud's own live Discovery Documents (every real member, resource and data-source mode together) and diffing mechanically against the previously committed group.

          Previous version: \`${{ steps.before.outputs.current }}\`
